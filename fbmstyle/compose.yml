name: ps_prj_www-fbmstyle

services:
  fallback:
    container_name: ps_con_www-fbmstyle_ws

    image: fbmstyle/ws:1.0.0-b.0-alpine

    networks:
      net-www:
        ipv4_address: 172.31.0.135
        aliases:
          - fbmstyle.s0.pimous.local

    restart: unless-stopped

networks:
  net-www:
    name: ps_net_www
    ipam:
      config:
        - subnet: 172.31.0.128/25
    enable_ipv6: false
    external: true